<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PWA 기반 오프라인 메모장 애플리케이션">
  <meta name="theme-color" content="#2E2842">

  <title>H_Memo</title>

  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- 아이콘 -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>

  <!-- 헤더 -->
  <header class="header">
    <h1 class="header__title">H_MEMO</h1>
    <button class="header__menu-btn" aria-label="더보기 메뉴">⋮</button>
  </header>

  <!-- 더보기 메뉴 -->
  <nav class="menu" id="menu" hidden>
    <ul class="menu__list">
      <li><button class="menu__item" id="exportBtn">메모 내보내기</button></li>
      <li><button class="menu__item" id="importBtn">메모 가져오기</button></li>
      <li class="menu__item-wrapper">
        <button class="menu__item" id="fontSizeBtn">글자크기 +</button>
        <!-- 글자크기 서브메뉴 -->
        <div class="menu__submenu" id="fontSizeSubmenu" hidden>
          <button class="menu__submenu-item" data-size="small">작게</button>
          <button class="menu__submenu-item" data-size="medium">보통</button>
          <button class="menu__submenu-item" data-size="large">크게</button>
        </div>
      </li>
      <li><button class="menu__item" id="darkModeBtn">다크모드</button></li>
    </ul>
  </nav>

  <!-- 숨겨진 파일 입력 (메모 가져오기용) -->
  <input type="file" id="importFileInput" accept=".json" hidden>

  <!-- 메인 컨텐츠 -->
  <main class="main">

    <!-- 메모 작성 영역 -->
    <section class="memo-editor">
      <input
        type="text"
        class="memo-editor__title"
        placeholder="제목 영역"
        aria-label="메모 제목"
      >
      <textarea
        class="memo-editor__content"
        placeholder="내용 영역"
        aria-label="메모 내용"
      ></textarea>

      <!-- 이미지 미리보기 영역 -->
      <div class="memo-editor__image-preview" id="imagePreview" hidden>
        <img class="memo-editor__image" id="previewImage" src="" alt="첨부 이미지">
        <button class="memo-editor__image-remove-btn" aria-label="이미지 삭제">✕</button>
      </div>

      <!-- 숨겨진 파일 입력 (카메라용) -->
      <input
        type="file"
        id="cameraInput"
        accept="image/*"
        capture="environment"
        hidden
      >

      <!-- 숨겨진 파일 입력 (앨범용) -->
      <input
        type="file"
        id="galleryInput"
        accept="image/*"
        hidden
      >

      <div class="memo-editor__actions">
        <div class="memo-editor__left-actions">
          <div class="memo-editor__image-btn-wrapper">
            <button class="memo-editor__image-btn" aria-label="이미지 추가">📷</button>

            <!-- 이미지 선택 메뉴 -->
            <div class="image-picker-menu" id="imagePickerMenu" hidden>
              <button class="image-picker-menu__item" id="cameraBtn">📷 사진 촬영</button>
              <button class="image-picker-menu__item" id="galleryBtn">🖼️ 앨범에서 선택</button>
            </div>
          </div>

          <button class="memo-editor__star-btn" aria-label="중요 표시">☆</button>
        </div>
        <button class="memo-editor__save-btn">저장하기</button>
      </div>
    </section>

    <!-- 메모 목록 영역 -->
    <section class="memo-list-section">

      <!-- 목록 헤더 -->
      <div class="memo-list-header">
        <h2 class="memo-list-header__title">저장된 메모</h2>
        <button class="memo-list-header__star-btn" aria-label="중요 메모 보기">★</button>
      </div>

      <!-- 검색 -->
      <div class="search-box">
        <input
          type="text"
          class="search-box__input"
          placeholder="메모 검색하기"
          aria-label="메모 검색"
        >
        <span class="search-box__icon">🔍</span>
      </div>

      <!-- 메모 목록 -->
      <ul class="memo-list" id="memoList">
        <!-- JavaScript로 동적 생성됨 -->
      </ul>

    </section>

  </main>

  <!-- 상세보기 화면 -->
  <section class="detail-view" id="detailView" hidden>
    <header class="detail-view__header">
      <button class="detail-view__back-btn" aria-label="뒤로가기">←</button>
      <h2 class="detail-view__title">메모 상세</h2>
      <div class="detail-view__actions">
        <button class="detail-view__edit-btn" aria-label="수정">✏️</button>
        <button class="detail-view__delete-btn" aria-label="삭제">🗑️</button>
      </div>
    </header>

    <div class="detail-view__content">
      <h3 class="detail-view__memo-title" id="detailTitle"></h3>
      <time class="detail-view__memo-date" id="detailDate"></time>

      <!-- 이미지 표시 영역 -->
      <div class="detail-view__image-container" id="detailImageContainer" hidden>
        <img class="detail-view__image" id="detailImage" src="" alt="첨부 이미지">
      </div>

      <p class="detail-view__memo-content" id="detailContent"></p>
    </div>

    <div class="detail-view__footer">
      <button class="detail-view__copy-btn">📋 복사</button>
      <button class="detail-view__share-btn">📤 공유</button>
    </div>
  </section>

  <!-- JavaScript -->
  <script src="js/app.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
